<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej.9</title>
</head>

<body>
    <h1>Ejemplo de Tabla</h1>
    <table>
        <caption>Horario de Clases</caption>
        <thead>
            <tr>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Matemáticas</td>
                <td>Lengua</td>
                <td>Historia</td>
                <td>Inglés</td>
                <td>Francés</td>
            </tr>
            <tr>
                <td>Francés</td>
                <td>Lengua</td>
                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Inglés</td>
            </tr>
            <tr>
                <td>Inglés</td>
                <td>Francés</td>
                <td>Matemáticas</td>
                <td>Matemáticas</td>
                <td>Historia</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">Sábados, Domingos y Festivos no hay clases</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
