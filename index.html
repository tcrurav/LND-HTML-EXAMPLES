<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej.6</title>
</head>

<body>

    <h1>Ejemplos de Hiperenlace</h1>

    <!-- El ejemplo más sencillo de hiperenlace -->
    <p>Visita el <a href="https://www.ieselrincon.es">sitio web del IES El Rincón</a>.</p>

    <!-- target="_self" - Abre el documento en la misma ventana o tab dónde se hizo clic. -->
    <p><a href="https://www.ieselrincon.es" target="_self">IES El Rincón</a>. Con _self</p>

    <!-- target="_blank" - Abre el documento en una nueva ventana o tab. -->
    <p><a href="https://www.ieselrincon.es" target="_blank">IES El Rincón</a>. Con _blank</p>

    <!-- target="_parent" - Abre el documento en el frame padre. -->
    <p><a href="https://www.ieselrincon.es" target="_parent">IES El Rincón</a>. Con _parent"</p>

    <!-- target="_top" - Abre el documento en el body de la ventana. -->
    <p><a href="https://www.ieselrincon.es" target="_top">IES El Rincón</a>. Con _top</p>

</body>

</html>
